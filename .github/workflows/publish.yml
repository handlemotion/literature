# Publishes @handlemotion/literature and @handlemotion/literature-cli to npm via OIDC trusted publishing.
# Register this workflow on each package at:
# https://www.npmjs.com/package/<name>/access → Trusted Publisher → GitHub Actions
#   Organization/user: handlemotion
#   Repository: literature
#   Workflow file: publish.yml
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: |
          pnpm turbo build \
            --filter=@handlemotion/literature... \
            --filter=@handlemotion/literature-cli

      - name: Publish to npm (OIDC)
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          pnpm publish -r \
            --filter '@handlemotion/literature' \
            --filter '@handlemotion/literature-cli' \
            --access public \
            --no-git-checks
