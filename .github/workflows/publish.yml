# Versions and publishes @handlemotion/literature and @handlemotion/literature-cli via Changesets.
# On main: opens a "Version Packages" PR when changesets exist; publishes after that PR merges.
# Register this workflow on each package at:
# https://www.npmjs.com/package/<name>/access → Trusted Publisher → GitHub Actions
#   Organization/user: handlemotion
#   Repository: literature
#   Workflow file: publish.yml
name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@handlemotion"
          always-auth: true

      - run: pnpm install --frozen-lockfile

      - name: Create version PR or publish to npm
        uses: changesets/action@v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
